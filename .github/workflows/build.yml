name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    # The Mac app (macOS/). Package.swift needs swift-tools-version 6.2 and the icon needs
    # actool from Xcode 26 or later.
    runs-on: macos-26
    defaults:
      run:
        working-directory: macOS
    steps:
      - uses: actions/checkout@v4

      - name: Select the newest Xcode 26 or later
        run: |
          xcode=$(ls -d /Applications/Xcode_2[6-9]*.app 2>/dev/null | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode"; fi
          xcodebuild -version
          swift --version

      - uses: actions/cache@v4
        with:
          path: macOS/.build
          key: spm-${{ runner.os }}-${{ hashFiles('macOS/Package.resolved') }}
          restore-keys: spm-${{ runner.os }}-

      - name: Test
        run: swift test

      - name: Assemble Clawd.app (ad-hoc signed)
        env:
          CLAWD_SIGN_IDENTITY: "-"
        run: ./build.sh --zip

      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-macOS-unsigned
          path: macOS/dist/*.zip
          retention-days: 7


  windows:
    # The Windows app (Windows/): Core tests, the WinUI 3 app published as a folder, then the MSI.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Test
        run: dotnet test Clawd.Core.Tests -c Release

      - name: Publish (self-contained, win-x64)
        run: dotnet publish Clawd/Clawd.csproj -c Release -r win-x64 -p:Platform=x64 -o publish/Clawd

      - name: Installer (MSI)
        run: dotnet build Installer -c Release

      - uses: actions/upload-artifact@v4
        with:
          name: Clawd-windows-x64
          path: Windows/Installer/bin/x64/Release/*.msi
          retention-days: 7

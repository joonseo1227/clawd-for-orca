name: Bug report
description: Something in Clawd does not work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Please do not paste pairing codes, tokens or private transcript contents.
        Security issues go through private reporting instead; see SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
  - type: input
    id: clawd
    attributes:
      label: Clawd version
      description: Shown in Settings, or the commit you built from.
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS version
      placeholder: macOS 26.0, Windows 11 24H2
    validations:
      required: true
  - type: input
    id: orca
    attributes:
      label: Orca version
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Alert cards / pet
        - Chat timeline
        - Permission answers
        - Terminal view (not paired)
        - Live terminal (paired)
        - Menu bar / hotkey / settings
        - Build / install
        - Other
  - type: textarea
    id: output
    attributes:
      label: Debug output
      description: >-
        If relevant, the output of `macOS/clawd --orca` or `--sessions` (on Windows,
        `dotnet run --project Clawd.Tools -- orca` or `-- sessions`), with private details removed.
      render: text
